<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админка — Kinomotor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/main.css?v={{ static_version('main.css') }}">
<style>
  .adm-shell{ max-width:1080px; margin:0 auto; padding:40px 24px 90px; }
  .adm-title{ font-family:'Fraunces', serif; font-weight:600; font-size:clamp(24px, 3vw, 32px); margin:0 0 24px; }

  .adm-tabs{ display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
  .adm-tab{
    padding:9px 16px; border-radius:8px; border:1px solid var(--hairline);
    background:var(--bg-panel); color:var(--ink-dim); font-size:13px; cursor:pointer;
  }
  .adm-tab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }

  .adm-stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:14px; margin-bottom:8px; }
  .adm-stat-card{ border:1px solid var(--hairline); border-radius:10px; background:var(--bg-panel); padding:18px 20px; }
  .adm-stat-value{ font-family:'Fraunces', serif; font-weight:600; font-size:28px; color:var(--ink); }
  .adm-stat-label{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.06em; margin-top:4px; }

  table.adm-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.adm-table th{
    text-align:left; padding:10px 12px; color:var(--ink-faint); font-weight:600;
    font-size:11.5px; text-transform:uppercase; letter-spacing:0.05em;
    border-bottom:1px solid var(--hairline);
  }
  table.adm-table td{ padding:10px 12px; border-bottom:1px solid var(--hairline); color:var(--ink-dim); }
  table.adm-table tr:last-child td{ border-bottom:none; }

  .adm-btn-small{
    padding:5px 12px; border-radius:6px; border:1px solid var(--accent-dim);
    background:none; color:var(--accent-dim); font-size:12px; cursor:pointer;
  }
  .adm-btn-small:hover{ background:var(--accent-soft); }

  .adm-empty{ padding:30px; text-align:center; color:var(--ink-faint); font-size:13px; }
  .adm-error-msg{ font-size:12px; color:var(--ink-faint); max-width:320px; white-space:pre-wrap; word-break:break-word; }
</style>
</head>
<body>

<main>
  <div class="adm-shell">
    <h1 class="adm-title">Админка</h1>

    <div class="adm-tabs">
      <button class="adm-tab active" data-tab="stats" onclick="switchTab('stats')">Статистика</button>
      <button class="adm-tab" data-tab="users" onclick="switchTab('users')">Пользователи</button>
      <button class="adm-tab" data-tab="payments" onclick="switchTab('payments')">Платежи</button>
      <button class="adm-tab" data-tab="errors" onclick="switchTab('errors')">Ошибки</button>
    </div>

    <div id="tab-stats" class="adm-tab-content"></div>
    <div id="tab-users" class="adm-tab-content" style="display:none;"></div>
    <div id="tab-payments" class="adm-tab-content" style="display:none;"></div>
    <div id="tab-errors" class="adm-tab-content" style="display:none;"></div>
  </div>
</main>

<script>
  const STATUS_TITLES_PAY = { NEW: 'Создан', CONFIRMED: 'Оплачен', REJECTED: 'Отклонён' };

  function switchTab(name) {
    document.querySelectorAll('.adm-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.adm-tab-content').forEach(c => c.style.display = 'none');
    document.getElementById(`tab-${name}`).style.display = 'block';
    loadTab(name);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  function formatDate(isoStr) {
    if (!isoStr) return '—';
    const d = new Date(isoStr.replace(' ', 'T') + 'Z');
    return d.toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  async function loadTab(name) {
    if (name === 'stats') return loadStats();
    if (name === 'users') return loadUsers();
    if (name === 'payments') return loadPayments();
    if (name === 'errors') return loadErrors();
  }

  async function loadStats() {
    const el = document.getElementById('tab-stats');
    const res = await fetch('/api/admin/stats');
    if (!res.ok) { el.innerHTML = '<div class="adm-empty">Нет доступа</div>'; return; }
    const d = await res.json();
    el.innerHTML = `
      <div class="adm-stats-grid">
        <div class="adm-stat-card"><div class="adm-stat-value">${d.total_users}</div><div class="adm-stat-label">Пользователей</div></div>
        <div class="adm-stat-card"><div class="adm-stat-value">${d.total_generations}</div><div class="adm-stat-label">Роликов всего</div></div>
        <div class="adm-stat-card"><div class="adm-stat-value">${d.today_generations}</div><div class="adm-stat-label">Роликов сегодня</div></div>
        <div class="adm-stat-card"><div class="adm-stat-value">${d.total_revenue_rub} ₽</div><div class="adm-stat-label">Выручка (оплачено)</div></div>
        <div class="adm-stat-card"><div class="adm-stat-value">${d.error_rate_percent}%</div><div class="adm-stat-label">Доля ошибок</div></div>
      </div>`;
  }

  async function loadUsers() {
    const el = document.getElementById('tab-users');
    const res = await fetch('/api/admin/users');
    if (!res.ok) { el.innerHTML = '<div class="adm-empty">Нет доступа</div>'; return; }
    const d = await res.json();
    if (!d.users.length) { el.innerHTML = '<div class="adm-empty">Пока нет пользователей</div>'; return; }
    el.innerHTML = `
      <table class="adm-table">
        <thead><tr><th>Email</th><th>Баланс</th><th>Регистрация</th><th>Роликов</th><th></th></tr></thead>
        <tbody>
          ${d.users.map(u => `
            <tr>
              <td>${escapeHtml(u.email)}</td>
              <td>${Math.floor(u.balance_kop / 100)} ₽</td>
              <td>${formatDate(u.created_at)}</td>
              <td>${u.generations_count}</td>
              <td><button class="adm-btn-small" onclick="topUp(${u.id}, '${escapeHtml(u.email)}')">Пополнить</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  async function topUp(userId, email) {
    const amountStr = prompt(`Сумма пополнения для ${email} (в рублях):`, '100');
    if (!amountStr) return;
    const amount = parseInt(amountStr, 10);
    if (!amount || amount <= 0) { alert('Введите корректную сумму'); return; }

    const res = await fetch('/api/admin/topup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, amount_rub: amount })
    });
    if (!res.ok) { alert('Не удалось пополнить баланс'); return; }
    loadUsers();
  }

  async function loadPayments() {
    const el = document.getElementById('tab-payments');
    const res = await fetch('/api/admin/payments');
    if (!res.ok) { el.innerHTML = '<div class="adm-empty">Нет доступа</div>'; return; }
    const d = await res.json();
    if (!d.payments.length) { el.innerHTML = '<div class="adm-empty">Платежей ещё не было</div>'; return; }
    el.innerHTML = `
      <table class="adm-table">
        <thead><tr><th>Email</th><th>Сумма</th><th>Статус</th><th>Дата</th></tr></thead>
        <tbody>
          ${d.payments.map(p => `
            <tr>
              <td>${escapeHtml(p.email)}</td>
              <td>${Math.floor(p.amount_kop / 100)} ₽</td>
              <td>${STATUS_TITLES_PAY[p.status] || p.status}</td>
              <td>${formatDate(p.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  async function loadErrors() {
    const el = document.getElementById('tab-errors');
    const res = await fetch('/api/admin/errors');
    if (!res.ok) { el.innerHTML = '<div class="adm-empty">Нет доступа</div>'; return; }
    const d = await res.json();
    if (!d.errors.length) { el.innerHTML = '<div class="adm-empty">Ошибок не было 🎉</div>'; return; }
    el.innerHTML = `
      <table class="adm-table">
        <thead><tr><th>Email</th><th>Тема</th><th>Источник</th><th>Ошибка</th><th>Дата</th></tr></thead>
        <tbody>
          ${d.errors.map(e => `
            <tr>
              <td>${escapeHtml(e.email)}</td>
              <td>${escapeHtml(e.topic)}</td>
              <td>${escapeHtml(e.source)} · ${e.duration}с</td>
              <td class="adm-error-msg">${escapeHtml(e.error_message)}</td>
              <td>${formatDate(e.created_at)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  loadStats();
</script>

</body>
</html>
